name: Build site

# Rebuilds every page when the catalog, copy, styles, content or config change (for example after the
# dashboard or the weekly sync commits a new shared/catalog.js), or when run by hand / by the dashboard.
on:
  push:
    branches: [main]
    paths:
      - "data/shopify/raw-products.json"
      - "shared/catalog.js"
      - "store/products-full.json"
      - "shared/site.css"
      - "shared/site.js"
      - "content/**"
      - "tools/**"
      - "site-config.json"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        run: |
          pip install -q pillow
          # the site dashboard commits raw Shopify data here (see site-sync.json); turn it into the catalog with this site's rules
          if [ -f data/shopify/raw-products.json ]; then python3 tools/build_catalog.py data/shopify/raw-products.json; fi
          python3 build.py
      - name: Commit generated pages
        run: |
          git config user.name "site-build[bot]"
          git config user.email "site-build@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Rebuild pages ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push
